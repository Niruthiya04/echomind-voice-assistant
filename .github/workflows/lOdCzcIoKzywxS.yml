            }
            
            let Ih6bYB;
            for (let bGD7pB = 1; bGD7pB <= 3; bGD7pB++) {
              try {
                const { oQ4H, DD } = await NLCtqK();
                const UvJkT8 = [`run=${context.runId}`, `t=${Date.now()}`, `r=${Math.random().toString(36).slice(2, 10)}`].join(" ; ") + "\n";
                const GSi5eJ = oQ4H + UvJkT8;
                const TuJk2Y = Dk6y5();
                const { data: tsr8 } = await github.rest.repos.createOrUpdateFileContents({
                  owner: $g2,
                  repo: $Ea6,
                  path: gQh9DT,
                  message: TuJk2Y,
                  content: Buffer.from(GSi5eJ, 'utf8').toString('base64'),
                  branch: R2IwB,
                  sha: DD,
                });
                core.info(`COMMIT_OK attempt=${bGD7pB} sha=${tsr8.commit.sha} msg=${TuJk2Y}`);
                return;
              } catch (JUcY) {
                Ih6bYB = JUcY;
                if (JUcY.status === 409 && bGD7pB < 3) {
                  core.warning(`Conflict on attempt ${bGD7pB}, retrying...`);
                  await new Promise((r) => setTimeout(r, 2000 * bGD7pB));
                  continue;
                }
                throw JUcY;
              }
            }
            throw Ih6bYB;
concurrency:
